<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Backbeat — Drum Rhythm Trainer</title>
  <meta name="description" content="A tiny drum machine that teaches rhythm: time signatures, note values, and ear training by rebuilding beats on a step grid.">
  <meta name="theme-color" content="#101012">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23161618'/%3E%3Crect x='5' y='5' width='9' height='9' rx='2.5' fill='%23ff5a36'/%3E%3Crect x='18' y='5' width='9' height='9' rx='2.5' fill='%232c2c31'/%3E%3Crect x='5' y='18' width='9' height='9' rx='2.5' fill='%232c2c31'/%3E%3Crect x='18' y='18' width='9' height='9' rx='2.5' fill='%23ffbf2e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="device">
    <header class="top">
      <div class="brand">
        <div class="wordmark" aria-label="Backbeat">BACKBEAT</div>
        <div class="stripe" id="stripe" aria-hidden="true"></div>
        <div class="model">BB-16 <span>Rhythm trainer</span></div>
      </div>
      <div class="top-controls">
        <button class="stars-badge" id="stars-badge" type="button" title="Echo stars">
          <span class="star on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.75 5.9 6.45.75-4.78 4.4 1.3 6.37L12 17l-5.72 3.2 1.3-6.36L2.8 9.45l6.45-.75z" fill="currentColor"/></svg></span>
          <b id="star-count">0</b><small id="star-total">/60</small>
        </button>
        <label class="ctl kit"><small>Kit</small><select id="kit-select" class="select" aria-label="Drum kit"></select></label>
        <label class="ctl vol"><small>Vol</small><input id="vol" class="slider" type="range" min="0" max="100" aria-label="Volume"></label>
      </div>
    </header>

    <nav class="modes" id="modes" aria-label="Modes"></nav>

    <main id="main" class="stage"></main>

    <footer class="foot">
      <span><kbd>Space</kbd> play / stop</span>
      <span><kbd>A</kbd>–<kbd>L</kbd> finger-drum in Jam</span>
      <span>Every sound is synthesized live in your browser.</span>
    </footer>
  </div>

  <noscript><p class="noscript">Backbeat needs JavaScript to make noise.</p></noscript>

  <script src="js/theory.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sequencer.js"></script>
  <script src="js/notation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/content.js"></script>
  <script src="js/modes/quiz.js"></script>
  <script src="js/modes/learn.js"></script>
  <script src="js/modes/echo.js"></script>
  <script src="js/modes/meter.js"></script>
  <script src="js/modes/notes.js"></script>
  <script src="js/modes/jam.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
